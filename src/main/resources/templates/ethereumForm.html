<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Submit Ethereum NFT Recommendation</title>
    <link rel="stylesheet" th:href="@{/css/nav.css}">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
        }
        .navbar {
            background: #1a202c;
            color: #fff;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar .brand a { color: #fff; text-decoration: none; font-weight: 700; }
        .nav-right { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
        .nav-right a { color: #fff; text-decoration: none; }

        .form-container {
            background: white;
            max-width: 700px;
            margin: 2rem auto;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; margin-bottom: 1rem; }
        label { font-weight: bold; display: block; margin-top: 1rem; }
        input, select, textarea {
            width: 100%;
            padding: 0.5rem;
            margin-top: 0.3rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        .error { color: #b00020; font-size: 0.9rem; margin-top: 0.25rem; }
        button {
            margin-top: 1.5rem;
            background-color: #007bff;
            color: white;
            padding: 0.7rem 1.2rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="brand"><a href="/">Assignment 15 Forum</a></div>
    <div class="nav-right">
      <span th:if="${#authorization.expression('isAuthenticated()')}">
        <a href="/profile" th:text="${#authentication.name}">Username</a>
        <a href="#" onclick="event.preventDefault(); document.getElementById('logoutForm').submit();">Logout</a>
      </span>
        <span th:if="${#authorization.expression('!isAuthenticated()')}">
        <a href="/login"><strong>Login</strong></a>
        <a href="/register"><strong>Register</strong></a>
      </span>
    </div>
</div>

<!-- Hidden logout form -->
<form id="logoutForm" th:action="@{/logout}" method="post" style="display:none;"></form>

<div class="form-container">
    <h2>Submit an Ethereum NFT Recommendation</h2>

    <!-- IMPORTANT: requires model attribute "ethereumNftRecommendation" from the controller -->
    <form th:action="@{/ethereumnft/submit}" method="post" th:object="${ethereumNftRecommendation}">
        <!-- CSRF token (Spring Security) -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <label for="collectionName">Collection Name:</label>
        <input id="collectionName" type="text" th:field="*{collectionName}" required />
        <div class="error" th:if="${#fields.hasErrors('collectionName')}" th:errors="*{collectionName}"></div>

        <label for="contractAddress">Contract Address:</label>
        <input id="contractAddress" type="text" th:field="*{contractAddress}" required />
        <div class="error" th:if="${#fields.hasErrors('contractAddress')}" th:errors="*{contractAddress}"></div>

        <label for="creator">Creator:</label>
        <input id="creator" type="text" th:field="*{creator}" />
        <div class="error" th:if="${#fields.hasErrors('creator')}" th:errors="*{creator}"></div>

        <label for="floorPrice">Floor Price (ETH):</label>
        <input id="floorPrice" type="number" step="0.0001" th:field="*{floorPrice}" required />
        <div class="error" th:if="${#fields.hasErrors('floorPrice')}" th:errors="*{floorPrice}"></div>

        <label for="targetPrice">Target Price (ETH):</label>
        <input id="targetPrice" type="number" step="0.0001" th:field="*{targetPrice}" />
        <div class="error" th:if="${#fields.hasErrors('targetPrice')}" th:errors="*{targetPrice}"></div>

        <label for="recommendation">Recommendation:</label>
        <select id="recommendation" th:field="*{recommendation}">
            <option value="BUY">Buy</option>
            <option value="HOLD">Hold</option>
            <option value="SELL">Sell</option>
        </select>
        <div class="error" th:if="${#fields.hasErrors('recommendation')}" th:errors="*{recommendation}"></div>

        <label for="reason">Reason for Recommendation:</label>
        <textarea id="reason" th:field="*{reason}" rows="4"></textarea>
        <div class="error" th:if="${#fields.hasErrors('reason')}" th:errors="*{reason}"></div>

        <label for="risks">Risks:</label>
        <textarea id="risks" th:field="*{risks}" rows="3"></textarea>
        <div class="error" th:if="${#fields.hasErrors('risks')}" th:errors="*{risks}"></div>

        <label for="officialLink">Official Link (optional):</label>
        <input id="officialLink" type="url" th:field="*{officialLink}" />
        <div class="error" th:if="${#fields.hasErrors('officialLink')}" th:errors="*{officialLink}"></div>

        <button type="submit">Submit</button>
    </form>
</div>

</body>
</html>
