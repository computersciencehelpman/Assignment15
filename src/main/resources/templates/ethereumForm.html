<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Submit Ethereum Recommendation</title>
    <link rel="stylesheet" th:href="@{/css/nav.css}">
    <style>
        body { font-family: Arial, sans-serif; background:#f0f2f5; margin:0; padding:0; }
        .navbar { background:#1a202c; color:#fff; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; }
        .navbar .brand a { color:#fff; text-decoration:none; font-weight:700; }
        .nav-right { display:flex; align-items:center; gap:12px; white-space:nowrap; }
        .nav-right a { color:#fff; text-decoration:none; }

        .form-container { background:#fff; max-width:700px; margin:2rem auto; padding:2rem; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,.1); }
        h2 { text-align:center; margin-bottom:1rem; }
        label { font-weight:bold; display:block; margin-top:1rem; }
        input, select, textarea { width:100%; padding:.5rem; margin-top:.3rem; border:1px solid #ccc; border-radius:4px; font-size:1rem; }
        .error { color:#b00020; font-size:.9rem; margin-top:.25rem; }
        button { margin-top:1.5rem; background:#007bff; color:#fff; padding:.7rem 1.2rem; border:0; border-radius:4px; cursor:pointer; font-size:1rem; }
        button:hover { background:#0056b3; }
    </style>
</head>
<body>
<div class="navbar">
    <div class="brand"><a href="/">Assignment 15 Forum</a></div>
    <div class="nav-right">
      <span th:if="${#authorization.expression('isAuthenticated()')}">
        <a href="/profile" th:text="${#authentication.name}">Username</a>
        <a href="#" onclick="event.preventDefault(); document.getElementById('logoutForm').submit();">Logout</a>
      </span>
        <span th:if="${#authorization.expression('!isAuthenticated()')}">
        <a href="/login"><strong>Login</strong></a>
        <a href="/register"><strong>Register</strong></a>
      </span>
    </div>
</div>
<form id="logoutForm" th:action="@{/logout}" method="post" style="display:none;"></form>

<div class="form-container">
    <h2>Submit an Ethereum Recommendation</h2>

    <!-- Must match controller attribute name: cryptoRecommendation -->
    <form th:action="@{/ethereum/submit}" method="post" th:object="${cryptoRecommendation}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <label for="tokenName">Token Name:</label>
        <input id="tokenName" type="text" th:field="*{tokenName}" required />
        <div class="error" th:if="${#fields.hasErrors('tokenName')}" th:errors="*{tokenName}"></div>

        <label for="contractAddress">Contract Address (CA):</label>
        <input id="contractAddress" type="text" th:field="*{contractAddress}" />
        <div class="error" th:if="${#fields.hasErrors('contractAddress')}" th:errors="*{contractAddress}"></div>

        <label for="currentPrice">Current Price (ETH):</label>
        <input id="currentPrice" type="number" step="0.0001" th:field="*{currentPrice}" />

        <label for="targetPrice">Target Price (ETH):</label>
        <input id="targetPrice" type="number" step="0.0001" th:field="*{targetPrice}" />

        <label for="recommendation">Recommendation:</label>
        <select id="recommendation" th:field="*{recommendation}">
            <option value="BUY">Buy</option>
            <option value="HOLD">Hold</option>
            <option value="SELL">Sell</option>
        </select>

        <label for="reason">Reason:</label>
        <textarea id="reason" rows="4" th:field="*{reason}"></textarea>

        <label for="risks">Risks:</label>
        <textarea id="risks" rows="3" th:field="*{risks}"></textarea>

        <button type="submit">Submit</button>
    </form>
</div>
</body>
</html>
